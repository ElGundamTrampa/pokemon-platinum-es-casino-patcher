name: Windows executable
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.11.1
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --onefile --windowed --name PlatinumCasinoPatcher --add-data "patches;patches" casino_patcher.py
      - run: Copy-Item README.md,LICENSE -Destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: PlatinumCasinoPatcher-windows
          path: dist/
